<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b33" />
    <title>Jeopardy - Questions</title>
    <link rel="stylesheet" href="css/style.css?v=mujj7s0v" />
    <link rel="stylesheet" href="css/editor.css?v=mujj7s0v" />
  </head>
  <body class="ed">
    <header class="ed-top">
      <button class="icon-btn only-phone" id="menuBtn" aria-label="Categories">☰</button>
      <span class="brand">QUESTIONS</span>
      <div class="search">
        <input type="search" id="search" placeholder="Search every question..." autocomplete="off" />
      </div>
      <span class="saved" id="saved">Saved</span>
      <span class="spacer"></span>
      <button class="btn small" id="shareBtn">📱 Send to phone</button>
      <div class="menu-wrap">
        <button class="btn small" id="moreBtn">More ▾</button>
        <div class="menu" id="moreMenu" hidden>
          <button id="exportBtn">Download backup file</button>
          <button id="importBtn">Load backup file</button>
          <button id="resetBtn" class="danger">Reset questions to built-in</button>
          <button id="factoryBtn" class="danger">Factory reset (erase everything)</button>
        </div>
      </div>
      <a class="btn small primary" href="index.html">▶ Play</a>
      <input type="file" id="importFile" accept=".json,application/json" hidden />
      <input type="file" id="picFile" accept="image/*" hidden />
    </header>

    <div class="ed-body">
      <aside class="side" id="side"></aside>
      <div class="side-backdrop" id="sideBackdrop"></div>
      <main class="ed-main" id="main"></main>
    </div>

    <div class="toast" id="toast" hidden></div>

    <div class="modal-backdrop" id="shareModal" hidden>
      <div class="modal">
        <h2>Send to your phone</h2>
        <p class="hint">
          Scan this with your phone camera (or copy the link and message it to yourself). It opens the host
          screen with these exact questions loaded.
        </p>
        <div id="qr" class="qr"></div>
        <p class="hint" id="shareNote"></p>
        <div class="row">
          <input type="text" id="shareLink" readonly style="flex: 1" />
          <button class="btn" id="copyLink">Copy</button>
          <button class="btn" id="nativeShare" hidden>Share…</button>
        </div>
        <div class="row" style="justify-content: flex-end; margin-top: 16px">
          <button class="btn" id="closeShare">Done</button>
        </div>
      </div>
    </div>

    <script src="js/config.js?v=mujj7s0v"></script>
    <script src="js/default-library.js?v=mujj7s0v"></script>
    <script src="js/shared.js?v=mujj7s0v"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/editor.js?v=mujj7s0v"></script>
  </body>
</html>
